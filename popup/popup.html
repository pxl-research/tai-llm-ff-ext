<!doctype html>
<html lang="en">

<head>
    <title>Plugin</title>
    <meta charset="utf-8"/>

    <!-- Milligram CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css">

    <link rel="stylesheet" href="popup.css"/>
</head>

<body>
<div id="popup-content">
    <div style="margin-bottom: 25px;">
        <h2>
            <img src="../assets/logo.png" alt="logo"
                 style="height: 60px; vertical-align: middle;"/>
            Pixie Lite Plug-in
        </h2>
    </div>

    <div>
        <label for="user_data">Enter the contents of your document here:</label>
        <textarea id="user_data" rows="5" cols="50" placeholder="Document text...">
My name is Jonathan Anderson.
My gmail address is just my first and last name before the @.
I was born on november 5th 1981.
I want to know if I need to be able to speak French to work in Canada.
        </textarea>
    </div>

    <div id="buttons">
        <button id="fill_out_form" class="button">
            Fill out form
        </button>
        <button id="reset_form" type="reset" class="button button-outline" style="display: none">
            Reset
        </button>
    </div>

    <div id="progress_bar" style="display: none">
        <progress id="progress"></progress>
        <p><small><span id="debug_msg"></span></small></p>
    </div>

    <div style="margin-top: 50px;">
        <label for="or_key">Enter OpenRouter key:</label>
        <input type="password" id="or_key" placeholder="sk-or-v1-f3a...907"/>
        <button id="save_or_key" class="button">
            Save key
        </button>
    </div>
</div>

<div id="error-content" class="hidden">
    <p>Cannot load plug-in.</p>
</div>

<script src="popup.js"></script>

</body>
</html>
