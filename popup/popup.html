<!doctype html>
<html lang="en">

<head>
    <title>Pixie Lite — LLM Form Filler</title>
    <meta charset="utf-8"/>

    <link rel="stylesheet" href="../assets/css/normalize.css"/>
    <link rel="stylesheet" href="popup.css"/>
</head>

<body>
<main id="popup-content">
    <header id="header">
        <img class="logo" src="../assets/logos/logo.png" alt="Pixie Lite logo"/>
        <div class="title-block">
            <h1>Pixie Lite</h1>
            <p class="tagline">LLM form filler</p>
        </div>
    </header>

    <section id="input" class="panel">
        <div class="panel-head">
            <h2>Input</h2>
            <button id="reset_form" type="button" class="btn btn-ghost">Clear form</button>
        </div>

        <label for="user_data">Paste the contents of your documents here</label>
        <textarea id="user_data" rows="5" placeholder="Contextual information …"></textarea>

        <button id="fill_out_form" type="button" class="btn btn-primary">Fill out form</button>

        <div id="progress_bar">
            <progress id="progress"></progress>
            <span id="debug_msg"></span>
        </div>

        <div id="error_msg" class="error-banner hidden" role="alert"></div>
    </section>

    <section id="output" class="panel">
        <div class="panel-head">
            <h2>Output</h2>
            <button id="reset_output" type="button" class="btn btn-ghost">Clear output</button>
        </div>

        <dl id="output_list"></dl>
    </section>

    <section id="settings" class="panel">
        <div class="panel-head">
            <h2>Settings</h2>
        </div>

        <label for="or_key">OpenRouter API key</label>
        <div class="key-row">
            <input type="password" id="or_key" placeholder="sk-or-v1-f3a…907"/>
            <button id="save_or_key" type="button" class="btn btn-primary">Save key</button>
        </div>
    </section>
</main>

<div id="error-content" class="hidden">
    <p>Cannot load plug-in.</p>
</div>

<script src="popup.js"></script>

</body>
</html>
